version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql_database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kirana_erp_master
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pma
    restart: always
    environment:
      PMA_HOST: mysql-db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - mysql-db

  node_api:
    build: ./backend
    container_name: node_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    working_dir: /app                 # <--- यहाँ working_dir फिक्स किया है
    volumes:
      - ./backend:/app
      - /app/node_modules
    # अगर आपके backend का मेन फाइल server.js है, तो 'npx nodemon server.js' लिखें
    command: npx nodemon index.js     # <--- यहाँ Hot-Reload कमांड ऐड की है (index.js को अपने मेन फाइल के नाम से बदल लें)
    depends_on:
      - mysql-db

  react_frontend:
    build: ./frontend
    container_name: react_app
    restart: always
    ports:
      - "5173:5173"
    working_dir: /app                 # <--- यहाँ working_dir फिक्स किया है
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host    # <--- Vite के लिए '--host' बहुत ज़रूरी है डॉकर में
    depends_on:
      - node_api
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true      # <--- Windows में फाइल चेंज डिटेक्ट करने के लिए ज़रूरी

volumes:
  db_data: